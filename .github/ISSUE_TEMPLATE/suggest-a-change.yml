name: Suggest a change
description: A new input, a new workflow, or a different default 💡
title: "Suggestion: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The repo setup or check that the current workflows don't cover.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you change?
    validations:
      required: true
