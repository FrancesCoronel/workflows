# Reusable CI for shell-script repos (dotfiles, install scripts).
# Runs ShellCheck on every *.sh / *.bash file and every file with a
# bash/sh/zsh shebang. zsh files are skipped, since ShellCheck can't parse them.
name: CI (shell)

on:
  workflow_call:
    inputs:
      severity:
        description: Minimum ShellCheck severity that fails the job (error, warning, info, style)
        type: string
        default: style
      exclude:
        description: Comma-separated ShellCheck codes to ignore, e.g. SC1090,SC1091
        type: string
        default: ""

permissions:
  contents: read

jobs:
  shellcheck:
    name: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: ShellCheck
        env:
          SEVERITY: ${{ inputs.severity }}
          EXCLUDE: ${{ inputs.exclude }}
        run: |
          files=()
          while IFS= read -r -d '' f; do
            [ -f "$f" ] || continue
            case "$f" in
              *.zsh) continue ;;
              *.sh|*.bash) files+=("$f"); continue ;;
            esac
            if head -n1 "$f" | grep -qE '^#!.*\b(ba|da)?sh\b'; then files+=("$f"); fi
          done < <(git ls-files -z)
          if [ "${#files[@]}" -eq 0 ]; then echo "No shell scripts found"; exit 0; fi
          printf '%s\n' "${files[@]}"
          args=(--severity "$SEVERITY" --format gcc)
          [ -n "$EXCLUDE" ] && args+=(--exclude "$EXCLUDE")
          shellcheck "${args[@]}" "${files[@]}" | sed -E 's/^([^:]+):([0-9]+):([0-9]+): (error|warning|note): (.*)$/::\4 file=\1,line=\2,col=\3::\5/; s/^::note /::notice /'
          exit "${PIPESTATUS[0]}"
