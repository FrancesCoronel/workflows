# Reusable CI for docs and awesome-list repos. Lints Markdown and checks links.
# On pull requests only the Markdown files the PR touches are link-checked, so
# an old dead link elsewhere never blocks a new contribution.
name: CI (Markdown)

on:
  workflow_call:
    inputs:
      lint:
        description: Run markdownlint-cli2
        type: boolean
        default: true
      lint-globs:
        description: Files for markdownlint, one glob per line (# excludes)
        type: string
        default: |
          **/*.md
          #.github
          #node_modules
      links:
        description: Check links with lychee
        type: boolean
        default: true
      lychee-args:
        description: Extra lychee arguments
        type: string
        default: ""

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Default markdownlint config
        id: mdcfg
        if: inputs.lint
        run: |
          # Repos with their own config keep it. Otherwise skip the rules that
          # fight normal prose: line length, inline HTML, first-line heading.
          if ls .markdownlint* .markdownlint-cli2.* >/dev/null 2>&1; then exit 0; fi
          echo '{ "default": true, "MD013": false, "MD033": false, "MD041": false }' > "$RUNNER_TEMP/markdownlint.json"
          echo "config=$RUNNER_TEMP/markdownlint.json" >> "$GITHUB_OUTPUT"

      - name: markdownlint
        if: inputs.lint
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: ${{ inputs.lint-globs }}
          config: ${{ steps.mdcfg.outputs.config }}

      - name: Pick files to link-check
        id: files
        if: inputs.links
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE" ]; then
            files=$(git diff --name-only --diff-filter=AM "$BASE"...HEAD -- '*.md' | tr '\n' ' ')
          else
            files=$(git ls-files '*.md' | tr '\n' ' ')
          fi
          echo "files=$files" >> "$GITHUB_OUTPUT"
          echo "Checking: ${files:-nothing}"

      - name: Check links
        id: lychee
        if: inputs.links && steps.files.outputs.files != ''
        uses: lycheeverse/lychee-action@v2
        with:
          fail: true
          output: ${{ runner.temp }}/lychee.md
          args: >-
            --no-progress
            --root-dir ${{ github.workspace }}
            --timeout 30
            --max-retries 3
            --retry-wait-time 5
            --exclude "mailto:"
            --accept 200,202,206,403,415,429,999
            ${{ inputs.lychee-args }}
            ${{ steps.files.outputs.files }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Show broken links
        if: failure() && steps.lychee.outcome == 'failure'
        env:
          REPORT: ${{ runner.temp }}/lychee.md
        run: |
          # Surface each broken link as an annotation so it shows on the PR
          # without opening the logs.
          grep -E '^\* \[' "$REPORT" | sed 's/^\* /::error title=Broken link::/' | head -50 || true
